name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --verbose

      - name: Run tests
        run: |
          python tests/test_ratio.py
          python tests/test_detect_synthetic.py
          python tests/test_detect_skewed.py
          python tests/test_detect_border_text.py
          python tests/test_real_image_evaluation.py
