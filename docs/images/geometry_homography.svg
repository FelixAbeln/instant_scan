<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size:16px; fill:#0f172a; text-anchor:middle; }
      .small { font-size:13px; fill:#475569; }
      .quad { fill:#f8fafc; stroke:#334155; stroke-width:3; }
      .inner { fill:#dbeafe; stroke:#2563eb; stroke-width:2; }
      .arrow { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .point { fill:#ef4444; }
      .line { stroke:#0891b2; stroke-width:3; stroke-dasharray:7 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="170" y="35" class="label">Detected source quadrilateral</text>
  <polygon points="70,120 310,80 345,315 45,335" class="quad"/>
  <polygon points="105,145 285,115 310,255 85,275" class="inner"/>
  <line x1="70" y1="120" x2="310" y2="80" class="line"/>
  <line x1="310" y1="80" x2="345" y2="315" class="line"/>
  <line x1="345" y1="315" x2="45" y2="335" class="line"/>
  <line x1="45" y1="335" x2="70" y2="120" class="line"/>
  <circle cx="70" cy="120" r="5" class="point"/>
  <circle cx="310" cy="80" r="5" class="point"/>
  <circle cx="345" cy="315" r="5" class="point"/>
  <circle cx="45" cy="335" r="5" class="point"/>
  <text x="67" y="105" class="label small">TL</text>
  <text x="312" y="65" class="label small">TR</text>
  <text x="360" y="318" class="label small">BR</text>
  <text x="30" y="350" class="label small">BL</text>

  <path d="M390 205 H505" class="arrow"/>
  <text x="448" y="190" class="label small">homography H</text>

  <text x="700" y="35" class="label">Corrected rectangle</text>
  <rect x="560" y="90" width="280" height="220" class="quad"/>
  <rect x="590" y="120" width="220" height="140" class="inner"/>
  <circle cx="560" cy="90" r="5" class="point"/>
  <circle cx="840" cy="90" r="5" class="point"/>
  <circle cx="840" cy="310" r="5" class="point"/>
  <circle cx="560" cy="310" r="5" class="point"/>
  <text x="700" y="340" class="label small">outer export includes border</text>
  <text x="700" y="285" class="label small">inner export uses blue rectangle</text>
</svg>
